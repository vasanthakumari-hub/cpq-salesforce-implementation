name: Controlled Salesforce Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment target'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          - production
      confirm_deploy:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string
      requirement_folder:
        description: 'Requirement folder name or ALL'
        required: true
        default: 'all'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Suppress Node.js warning

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "❌ Type DEPLOY to confirm"
            exit 1
          fi
          echo "✅ Gate passed → ${{ github.event.inputs.environment }}"

  extract-and-commit:
    needs: gate-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Salesforce code from ALL agent files
        run: |
          python3 << 'PYEOF'
          import re, pathlib

          req_filter = "${{ github.event.inputs.requirement_folder }}".lower()

          PATTERNS = [
              r'\*\*File Path:\*\*\s*`([^`]+)`\s*```(?:\w+)?\n(.*?)```',
              r'`(force-app/[^\s`]+\.(?:xml|cls|trigger|js|html|css|json))`\s*\n+```(?:\w+)?\n(.*?)```',
              r'\*\*(force-app/[^*\n]+)\*\*\s*\n+```(?:\w+)?\n(.*?)```',
              r'^(force-app/\S+\.(?:xml|cls|trigger|js|html|css|json))\s*\n```(?:\w+)?\n(.*?)```',
              r'`((?:manifest|scripts)/[^\s`]+)`\s*\n+```(?:\w+)?\n(.*?)```',
          ]

          def extract_from_file(md_path):
              content = pathlib.Path(md_path).read_text()
              extracted = []
              seen = set()
              for pattern in PATTERNS:
                  for fp, code in re.findall(pattern, content, re.DOTALL|re.MULTILINE):
                      fp = fp.strip()
                      if fp in seen:
                          continue
                      seen.add(fp)
                      out = pathlib.Path(fp)
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_text(code.strip() + '\n')
                      extracted.append(fp)
                      print(f"  ✅ {fp}")
              return extracted

          agent_files = [
              'developer-agent.md',
              'devops-agent.md',
              'admin-agent.md',
              'qa-agent.md'
          ]

          all_md = list(pathlib.Path('docs/requirements').rglob('*.md'))
          print(f"Found {len(all_md)} .md files\n")

          total = []
          for md in sorted(all_md):
              if req_filter != 'all' and req_filter not in str(md).lower():
                  continue
              if not any(a in md.name for a in agent_files):
                  continue
              print(f"📄 {md}")
              files = extract_from_file(md)
              total.extend(files)
              if not files:
                  print(f"  ⚠️  No matching file paths found in {md.name}")

          print(f"\n{'='*50}")
          print(f"✅ Total extracted: {len(total)} files")
          for f in total:
              print(f"  → {f}")
          PYEOF

      - name: Create sfdx-project.json      # ← Fixed step
        run: |
          if [ ! -f "sfdx-project.json" ]; then
            echo '{
              "packageDirectories": [{"path": "force-app", "default": true}],
              "namespace": "",
              "sfdcLoginUrl": "https://login.salesforce.com",
              "sourceApiVersion": "59.0"
            }' > sfdx-project.json
            echo "✅ Created sfdx-project.json"
          else
            echo "ℹ️ sfdx-project.json already exists"
          fi

      - name: Check and commit changes
        id: check_changes
        run: |
          git add force-app/ manifest/ scripts/ sfdx-project.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nothing new to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📦 Files to commit:"
            git diff --staged --name-only
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "feat(sf): extract [${{ github.event.inputs.requirement_folder }}] $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Pushed to GitHub"
          fi

  deploy-to-salesforce:
    needs: extract-and-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.SFDX_AUTH_URL_PROD }}" > auth_url.txt
          else
            echo "${{ secrets.SFDX_AUTH_URL_SANDBOX }}" > auth_url.txt
          fi
          sf org login sfdx-url -f auth_url.txt -a target-org
          rm -f auth_url.txt

      - name: Validate & Deploy
        run: |
          if [ -d "force-app/main/default" ]; then
            echo "🔍 Validating..."
            sf project deploy start \
              --source-dir force-app \
              --test-level RunLocalTests \
              --dry-run --target-org target-org --wait 30
            echo "🚀 Deploying to ${{ github.event.inputs.environment }}..."
            sf project deploy start \
              --source-dir force-app \
              --test-level RunLocalTests \
              --target-org target-org --wait 60
            echo "✅ Done!"
          else
            echo "❌ force-app/main/default not found"
            echo "The developer-agent.md may not contain extractable SFDX file paths"
            exit 1
          fi
